<ul
  class="flex flex-col gap-0.5 py-0.5"
  aria-live="polite"
  [attr.aria-label]="'shared.passwordChecklist.label' | translate"
>
  @for (rule of rules(); track rule.id + ':' + rule.met) {
    <li
      class="flex items-center gap-1.5"
      [class.rule--met]="rule.met"
      [class.rule--unmet-invalid]="!rule.met && invalid()"
      [attr.data-met]="rule.met"
    >
      <mat-icon class="!h-4 !w-4 shrink-0 !text-base !leading-4" aria-hidden="true">
        {{ rule.met ? 'check_circle' : 'radio_button_unchecked' }}
      </mat-icon>
      <span>
        {{ 'shared.passwordChecklist.rules.' + rule.id | translate }}
        <span class="sr-only">
          {{ (rule.met ? 'shared.passwordChecklist.met' : 'shared.passwordChecklist.notMet') | translate }}
        </span>
      </span>
    </li>
  }
</ul>
