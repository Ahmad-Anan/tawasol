<div class="mx-auto flex max-w-2xl flex-col px-4 py-16">
  <div class="flex flex-col items-center gap-4 rounded-2xl bg-(--color-surface) p-8 text-center">
    <mat-icon class="!h-12 !w-12 !text-5xl text-(--color-text-secondary) opacity-50" aria-hidden="true">
      explore_off
    </mat-icon>
    <h1 class="text-2xl font-bold text-(--color-text-primary)" style="font-family: var(--font-display)">
      {{ 'notFound.title' | translate }}
    </h1>
    <p class="text-(--color-text-secondary)">{{ 'notFound.message' | translate }}</p>
    <a mat-flat-button [routerLink]="homeLink()" class="mt-2 h-11 bg-(--color-harbor-600)! text-white!">
      {{ 'notFound.home' | translate }}
    </a>
  </div>
</div>
