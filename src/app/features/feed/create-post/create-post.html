<form class="create-post rounded-2xl bg-(--color-surface) p-4 shadow-sm sm:p-5" (submit)="$event.preventDefault(); onSubmit()">
  <div class="flex items-start gap-3">
    @if (currentUser(); as user) {
      <img [ngSrc]="user.photo" width="40" height="40" alt="" class="mt-1 h-10 w-10 shrink-0 rounded-full object-cover" />
    }

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>{{ 'feed.createPost.placeholder' | translate }}</mat-label>
      <textarea matInput dir="auto" rows="2" [formField]="createForm.body"></textarea>
    </mat-form-field>
  </div>

  @if (imagePreviewUrl(); as previewUrl) {
    <div class="relative mt-1 w-full overflow-hidden rounded-xl" style="aspect-ratio: 16 / 9">
      <img [src]="previewUrl" class="h-full w-full object-cover" alt="" />
      <button
        mat-icon-button
        type="button"
        class="!absolute end-2 top-2 !bg-black/50"
        [attr.aria-label]="'feed.createPost.removeImage' | translate"
        (click)="removeImage()"
      >
        <mat-icon class="!text-white">close</mat-icon>
      </button>
    </div>
  }

  <!-- Real failures only (API error, unusable image), next to the Post button. -->
  @if (error()) {
    <p class="mt-2 text-end text-sm text-(--color-error-text)" role="alert">{{ error() }}</p>
  }

  <div class="mt-3 flex items-center justify-between">
    <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'feed.createPost.addImage' | translate"
      (click)="fileInput.click()"
    >
      <mat-icon class="text-(--mat-sys-primary)">image</mat-icon>
    </button>

    <!--
      Disabled while there's nothing to post, but disabledInteractive keeps it focusable (with
      aria-disabled) so a screen reader user can reach it and hear why via aria-describedby.
    -->
    <span id="create-post-empty-hint" class="sr-only">{{ 'shared.composer.emptyHint' | translate }}</span>
    <button
      mat-flat-button
      type="submit"
      class="composer-submit"
      [disabled]="!canPost() || createForm().submitting()"
      [disabledInteractive]="true"
      [attr.aria-describedby]="canPost() ? null : 'create-post-empty-hint'"
    >
      @if (createForm().submitting()) {
        <mat-spinner diameter="20" class="mx-auto" />
      } @else {
        {{ 'feed.createPost.submit' | translate }}
      }
    </button>
  </div>
</form>
