<nav class="flex items-center justify-between gap-4 bg-(--color-harbor-950) px-4 py-3">
  <div class="flex items-center gap-1">
    @if (authService.user(); as user) {
      <a
        [routerLink]="['/profile', user._id]"
        class="flex shrink-0 items-center rounded-full"
        [attr.aria-label]="'navbar.myProfile' | translate"
      >
        <img [ngSrc]="user.photo" width="32" height="32" alt="" class="h-8 w-8 rounded-full object-cover" />
      </a>
    }

    @if (authService.isAuthenticated()) {
      <button
        mat-icon-button
        type="button"
        routerLink="/bookmarks"
        [attr.aria-label]="'navbar.bookmarks' | translate"
      >
        <mat-icon class="text-(--color-bone-100)">bookmark</mat-icon>
      </button>
    }

    @if (authService.isAuthenticated()) {
      <button
        mat-icon-button
        type="button"
        routerLink="/notifications"
        [matBadge]="notificationsService.unreadCount()"
        [matBadgeHidden]="!notificationsService.hasUnread()"
        matBadgeColor="warn"
        matBadgeSize="small"
        [attr.aria-label]="'navbar.notifications' | translate"
      >
        <mat-icon class="text-(--color-bone-100)">notifications</mat-icon>
      </button>
    }

    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="
        (themeService.mode() === 'dark' ? 'navbar.themeToggle.toLight' : 'navbar.themeToggle.toDark')
          | translate
      "
      (click)="themeService.toggle()"
    >
      <mat-icon class="text-(--color-bone-100)">
        {{ themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="
        (languageService.lang() === 'ar' ? 'navbar.languageToggle.toEnglish' : 'navbar.languageToggle.toArabic')
          | translate
      "
      (click)="languageService.toggle()"
    >
      <span class="text-sm font-bold text-(--color-bone-100)">
        {{ languageService.lang() === 'ar' ? 'EN' : 'AR' }}
      </span>
    </button>
  </div>

  @if (authService.isAuthenticated()) {
    <a
      routerLink="/feed"
      class="text-lg font-bold text-(--color-bone-100)"
      style="font-family: var(--font-display)"
      [attr.aria-label]="'navbar.goHome' | translate"
    >
      {{ 'navbar.brand' | translate }}
    </a>
  } @else {
    <span class="text-lg font-bold text-(--color-bone-100)" style="font-family: var(--font-display)">
      {{ 'navbar.brand' | translate }}
    </span>
  }
</nav>
