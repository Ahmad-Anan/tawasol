name: Demo cleanup

# Deletes visitor content from the public demo account once a day, keeping the showcase posts
# and their original comments (allowlist: scripts/demo-showcase.json). Credentials come from the
# DEMO_LOGIN / DEMO_PASSWORD repository secrets. A manual run is a dry run unless unticked.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: only log what would be deleted'
        type: boolean
        default: true

# Read-only token: the job only checks out the repo and reads the DEMO_* secrets.
permissions:
  contents: read

# Queues overlapping runs instead of cancelling one mid-cleanup (no cancel-in-progress here).
concurrency:
  group: demo-cleanup

# Actions pinned to full commit SHAs, same as ci.yml.
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Test the allowlist logic
        run: node --test scripts/demo-cleanup.test.mjs

      - name: Clean up the demo account
        run: node scripts/demo-cleanup.mjs
        env:
          DEMO_LOGIN: ${{ secrets.DEMO_LOGIN }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # A scheduled run has no inputs, so it really deletes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
