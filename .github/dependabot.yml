# Monthly dependency updates, grouped so each ecosystem opens as few PRs as possible.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs (see ci.yml); Dependabot bumps the SHA and the
  # trailing tag comment together.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Angular, TypeScript and Tailwind majors are upgraded by hand, together (ng update, matching
    # TypeScript range, Tailwind config changes), never one at a time by a bot.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      # Tailwind's PostCSS plugin is versioned in lockstep with tailwindcss.
      - dependency-name: '@tailwindcss/*'
        update-types: ['version-update:semver-major']
